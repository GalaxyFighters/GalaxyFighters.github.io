 for(const b of s.bombs)for(let side=0;side<2;side++)if(b.live[side])sprite(g,48,11,b.x,mirror(side,b.y),1.25,false,!!side);
 for(const f of s.fighters)if(f.mode!=='waiting'&&f.mode!=='done'){
  const spin=f.mode==='towing'||f.mode==='rescue';
  g.save();g.translate(f.x,f.y);if(spin)g.rotate(Math.floor(f.age*16)*Math.PI/4);
  sprite(g,6,f.mode==='rescue'?9:7,0,0,1.6,false,!f.side);g.restore()
 }
 for(let i=0;i<2;i++){
  const p=s.p[i];if(p.h&&!p.respawn&&(!p.flash||Math.floor(p.flash*15)%2===0))
   for(const x of guns(p))sprite(g,6,9,x,line(i),1.75,false,!!i)
 }
 for(const [x,y,at,ship] of s.effects){
  const f=Math.min(3,Math.floor(Math.max(0,s.t-at)*10));
  if(ship){for(let j=0;j<2;j++)for(let i=0;i<2;i++)sprite(g,32+f*4+i+2*j,9,x+(0.5-j)*18,y+(i-.5)*18,1.15)}
  else sprite(g,65+f,7,x,y,1.6);
 }
 g.restore();
 for(let i=0;i<2;i++){const y=i?606:12,p=s.p[i?me:1-me];
  text(g,i?'YOU':role==='ai'?difficulty.toUpperCase():'RIVAL',i?14:4,12,y+2);
  for(let n=0;n<p.h;n++){const x=96+n*21;for(let j=0;j<2;j++)for(let k=0;k<2;k++)glyph(g,74+2*j+k,3,x+8*k,y+8*j,1)}
 }
 text(g,'STAGE '+s.wave,14,265,14);glyph(g,54,1,378,8,1.25);glyph(g,55,1,378,18,1.25);
 text(g,'RAPID FIRE',14,263,608);
}
function refreshControls(){const keys=new Set(held.values());firing=keys.has('fire');for(const b of pad.querySelectorAll('button'))b.classList.toggle('held',keys.has(b.dataset.key))}
function clearControls(){held.clear();refreshControls()}
for(const b of pad.querySelectorAll('button')){b.onpointerdown=e=>{if(mode!=='play')return;e.preventDefault();b.setPointerCapture(e.pointerId);if(b.dataset.key==='fire'){trigger++;queued=true}held.set(e.pointerId,b.dataset.key);refreshControls()};b.onpointerup=b.onpointercancel=b.onlostpointercapture=e=>{held.delete(e.pointerId);refreshControls()};b.oncontextmenu=e=>e.preventDefault()}
window.addEventListener('blur',clearControls);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearControls()})
function steer(dt){let keys=new Set(held.values()),direction=Number(keys.has('right'))-Number(keys.has('left'));local=limit(local+direction*(role==='guest'?-1:1)*305*dt,18,382)}
const keyMap={ArrowLeft:'left',ArrowRight:'right',Space:'fire'};
window.addEventListener('keydown',e=>{if(mode!=='play'||!keyMap[e.code])return;e.preventDefault();if(held.has(e.code))return;held.set(e.code,keyMap[e.code]);if(e.code==='Space'){trigger++;queued=true}refreshControls()});
window.addEventListener('keyup',e=>{if(held.delete(e.code)){e.preventDefault();refreshControls()}});
function frame(now){let dt=Math.min(.1,(now-last)/1000);last=now;clock+=dt;if(mode==='play')steer(dt);if((role==='host'||role==='guest')&&mode!=='menu')packet(now);if(mode==='play'&&role!=='guest'){acc+=dt;while(acc>=1/60){step(state,1/60);acc-=1/60}if(state.over){if(role==='host')send(['s',nonce,session,++tick,snapshot()]);result()}}draw();requestAnimationFrame(frame)}
async function bootDuel(){
 try{romFiles=await loadSet();home();requestAnimationFrame(frame)}
 catch(error){menu('Game could not start','Reload the arcade board to try again.',[['Retry',bootDuel]])}
}
bootDuel()
</script></body></html>
